[package]
name = "autumn-plugin-graphql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "Production-grade GraphQL for Autumn: mount any async-graphql schema with query limits, persisted queries, subscriptions, observability and error masking"
repository = "https://github.com/autumn-foundation/autumn-graphql-plugin"
readme = "README.md"
keywords = ["graphql", "autumn", "async-graphql", "axum", "plugin"]
categories = ["web-programming::http-server", "web-programming::websocket"]
exclude = [".github/", "docs/"]

[features]
default = []
# Test helpers (`autumn_plugin_graphql::testing`) for driving a mounted
# endpoint through `autumn_web::test::TestClient`.
test-support = []
# Mirror async-graphql's `boxed-trait` feature. async-graphql changes the shape
# of its `Executor` trait under that feature, so an app that turns it on must
# turn this on too (Cargo cannot do it for us).
boxed-trait = ["async-graphql/boxed-trait", "dep:async-trait"]
# Declare a `PluginContract` (`Plugin::contract`) so `autumn plugin-check`
# and the startup compatibility gate see this plugin's supported range. The
# contract API is on autumn-web `main` and ships in the release after 0.7.0;
# the published 0.7.0 does not have it, so this is opt-in until then.
plugin-contract = []

[dependencies]
# The framework. No default features: this crate needs only the core surface
# (plugin API, `AppState`, errors, metrics, config/env helpers), and Cargo
# unifies features with whatever the host app enables.
autumn-web = { version = "0.7", default-features = false }
# The GraphQL executor. Default features are off: `graphiql`/`playground` pull
# CDN-hosted HTML that Autumn's default CSP blocks, and `tempfile` is only a
# storage strategy for uploads (they are held in memory, bounded by limits).
async-graphql = { version = "7.0", default-features = false }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", default-features = false, features = ["ws", "json", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
http = "1"
http-body-util = "0.1"
lru = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
toml = "1.1"
tower = { version = "0.5", default-features = false }
tracing = "0.1"

[dev-dependencies]
async-graphql = { version = "7.0", default-features = false, features = ["dynamic-schema"] }
autumn-web = { version = "0.7", default-features = false }
axum = { version = "0.8", features = ["tokio", "http1", "ws"] }
proptest = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }


[[example]]
name = "notes"
path = "examples/notes.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
